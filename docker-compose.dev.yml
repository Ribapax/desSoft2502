services:
  api-dev:
    image: node:20-alpine
    working_dir: /app
    command: sh -c "npm install && npm run dev"
    volumes:
      - ./:/app
      - /app/node_modules
    environment:
      - PORT=3333
      - DB_HOST=db
      - DB_PORT=5432
      - DB_NAME=seu_cantinho
      - DB_USER=seucantinho
      - DB_PASSWORD=seucantinho
    ports:
      - '3333:3333'
    depends_on:
      - db

  web-dev:
    image: node:20-alpine
    working_dir: /app
    command: sh -c "npm install && npm run dev -- --host --port 8080"
    volumes:
      - ./frontend:/app
      - /app/node_modules
    ports:
      - '8080:8080'
    depends_on:
      - api-dev

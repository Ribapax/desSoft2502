openapi: 3.1.0
info:
  title: API Seu Cantinho
  version: 1.0.0
  description: |
    Camada de apresentação REST do sistema "Seu Cantinho". A API cobre os recursos
    de usuários, espaços, reservas e pagamentos, adotando validações contra
    double-booking via índice único por espaço/data e documentação em português.
servers:
  - url: http://localhost:3333
    description: Ambiente local de desenvolvimento
paths:
  /api/health:
    get:
      summary: Verifica a saúde da API
      tags: [Infra]
      responses:
        '200':
          description: Serviço operacional
          content:
            application/json:
              schema:
                type: object
                properties:
                  status:
                    type: string
                    example: ok
  /api/users:
    get:
      summary: Lista usuários
      tags: [Usuários]
      responses:
        '200':
          description: Lista retornada com sucesso
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: '#/components/schemas/User'
    post:
      summary: Cadastra usuário
      tags: [Usuários]
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/CreateUserPayload'
      responses:
        '201':
          description: Usuário criado
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/User'
        '409':
          $ref: '#/components/responses/Conflict'
  /api/tenants:
    get:
      summary: Lista tenants
      tags: [Tenants]
      responses:
        '200':
          description: Lista de tenants
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: '#/components/schemas/Tenant'
    post:
      summary: Cria tenant
      tags: [Tenants]
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/CreateTenantPayload'
      responses:
        '201':
          description: Tenant criado
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Tenant'
        '409':
          $ref: '#/components/responses/Conflict'
  /api/tenants/{id}:
    get:
      summary: Consulta tenant
      tags: [Tenants]
      parameters:
        - $ref: '#/components/parameters/ResourceId'
      responses:
        '200':
          description: Tenant encontrado
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Tenant'
        '404':
          $ref: '#/components/responses/NotFound'
    put:
      summary: Atualiza tenant
      tags: [Tenants]
      parameters:
        - $ref: '#/components/parameters/ResourceId'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/UpdateTenantPayload'
      responses:
        '200':
          description: Tenant atualizado
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Tenant'
        '404':
          $ref: '#/components/responses/NotFound'
    delete:
      summary: Remove tenant
      tags: [Tenants]
      parameters:
        - $ref: '#/components/parameters/ResourceId'
      responses:
        '204':
          description: Tenant removido
        '404':
          $ref: '#/components/responses/NotFound'
  /api/auth/login:
    post:
      summary: Autentica um usuário
      tags: [Autenticação]
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/AuthLoginPayload'
      responses:
        '200':
          description: Login bem-sucedido
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/AuthLoginResponse'
        '401':
          description: Credenciais inválidas
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
  /api/users/{id}:
    get:
      summary: Consulta usuário
      tags: [Usuários]
      parameters:
        - $ref: '#/components/parameters/ResourceId'
      responses:
        '200':
          description: Usuário encontrado
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/User'
        '404':
          $ref: '#/components/responses/NotFound'
    put:
      summary: Atualiza usuário
      tags: [Usuários]
      parameters:
        - $ref: '#/components/parameters/ResourceId'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/UpdateUserPayload'
      responses:
        '200':
          description: Usuário atualizado
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/User'
        '404':
          $ref: '#/components/responses/NotFound'
    delete:
      summary: Remove usuário
      tags: [Usuários]
      parameters:
        - $ref: '#/components/parameters/ResourceId'
      responses:
        '204':
          description: Usuário removido
        '404':
          $ref: '#/components/responses/NotFound'
  /api/spaces:
    get:
      summary: Lista espaços
      tags: [Espaços]
      responses:
        '200':
          description: Lista de espaços
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: '#/components/schemas/Space'
    post:
      summary: Cadastra espaço
      tags: [Espaços]
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/CreateSpacePayload'
      responses:
        '201':
          description: Espaço criado
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Space'
  /api/spaces/{id}:
    get:
      summary: Consulta espaço
      tags: [Espaços]
      parameters:
        - $ref: '#/components/parameters/ResourceId'
      responses:
        '200':
          description: Espaço encontrado
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Space'
        '404':
          $ref: '#/components/responses/NotFound'
    put:
      summary: Atualiza espaço
      tags: [Espaços]
      parameters:
        - $ref: '#/components/parameters/ResourceId'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/UpdateSpacePayload'
      responses:
        '200':
          description: Espaço atualizado
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Space'
    delete:
      summary: Remove espaço
      tags: [Espaços]
      parameters:
        - $ref: '#/components/parameters/ResourceId'
      responses:
        '204':
          description: Espaço excluído
  /api/reservations:
    get:
      summary: Lista reservas com filtros opcionais
      tags: [Reservas]
      parameters:
        - in: query
          name: userId
          schema:
            type: string
        - in: query
          name: spaceId
          schema:
            type: string
      responses:
        '200':
          description: Lista de reservas
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: '#/components/schemas/Reservation'
    post:
      summary: Cadastra reserva garantindo ausência de double-booking diário
      tags: [Reservas]
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/CreateReservationPayload'
      responses:
        '201':
          description: Reserva criada
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Reservation'
        '409':
          description: Espaço indisponível
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
  /api/reservations/{id}:
    get:
      summary: Consulta reserva
      tags: [Reservas]
      parameters:
        - $ref: '#/components/parameters/ResourceId'
      responses:
        '200':
          description: Reserva encontrada
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Reservation'
        '404':
          $ref: '#/components/responses/NotFound'
    put:
      summary: Atualiza reserva com validação de conflitos diários
      tags: [Reservas]
      parameters:
        - $ref: '#/components/parameters/ResourceId'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/UpdateReservationPayload'
      responses:
        '200':
          description: Reserva atualizada
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Reservation'
    delete:
      summary: Cancela reserva
      tags: [Reservas]
      parameters:
        - $ref: '#/components/parameters/ResourceId'
      responses:
        '204':
          description: Reserva removida
  /api/payments:
    get:
      summary: Lista pagamentos
      tags: [Pagamentos]
      responses:
        '200':
          description: Lista de pagamentos
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: '#/components/schemas/Payment'
    post:
      summary: Registra pagamento
      tags: [Pagamentos]
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/CreatePaymentPayload'
      responses:
        '201':
          description: Pagamento criado
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Payment'
  /api/payments/{id}:
    get:
      summary: Consulta pagamento
      tags: [Pagamentos]
      parameters:
        - $ref: '#/components/parameters/ResourceId'
      responses:
        '200':
          description: Pagamento encontrado
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Payment'
        '404':
          $ref: '#/components/responses/NotFound'
    put:
      summary: Atualiza pagamento
      tags: [Pagamentos]
      parameters:
        - $ref: '#/components/parameters/ResourceId'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/UpdatePaymentPayload'
      responses:
        '200':
          description: Pagamento atualizado
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Payment'
    delete:
      summary: Remove pagamento
      tags: [Pagamentos]
      parameters:
        - $ref: '#/components/parameters/ResourceId'
      responses:
        '204':
          description: Pagamento removido
components:
  parameters:
    ResourceId:
      in: path
      name: id
      required: true
      schema:
        type: string
  responses:
    NotFound:
      description: Recurso não localizado
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/Error'
    Conflict:
      description: Conflito ou regra de negócio violada
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/Error'
  schemas:
    User:
      type: object
      properties:
        id:
          type: string
          format: uuid
        name:
          type: string
        email:
          type: string
          format: email
        phone:
          type: string
        createdAt:
          type: string
          format: date-time
        roles:
          type: array
          items:
            type: object
            properties:
              id:
                type: string
              name:
                type: string
              description:
                type: string
        tenantIds:
          type: array
          items:
            type: string
    CreateUserPayload:
      type: object
      required: [name, email, password]
      properties:
        name:
          type: string
        email:
          type: string
          format: email
        password:
          type: string
        phone:
          type: string
        roles:
          type: array
          items:
            type: string
        tenantIds:
          type: array
          items:
            type: string
    UpdateUserPayload:
      type: object
      properties:
        name:
          type: string
        email:
          type: string
          format: email
        password:
          type: string
        phone:
          type: string
        roles:
          type: array
          items:
            type: string
        tenantIds:
          type: array
          items:
            type: string
    AuthLoginPayload:
      type: object
      required: [email, password]
      properties:
        email:
          type: string
          format: email
        password:
          type: string
    AuthLoginResponse:
      type: object
      properties:
        user:
          $ref: '#/components/schemas/User'
    Tenant:
      type: object
      properties:
        id:
          type: string
          format: uuid
        name:
          type: string
        description:
          type: string
        status:
          type: boolean
        createdAt:
          type: string
          format: date-time
        roles:
          type: array
          items:
            type: object
            properties:
              id:
                type: string
              name:
                type: string
              description:
                type: string
    CreateTenantPayload:
      type: object
      required: [name]
      properties:
        name:
          type: string
        description:
          type: string
        status:
          type: boolean
    UpdateTenantPayload:
      type: object
      properties:
        name:
          type: string
        description:
          type: string
        status:
          type: boolean
    Space:
      type: object
      properties:
        id:
          type: string
        name:
          type: string
        description:
          type: string
        capacity:
          type: integer
        price:
          type: number
        coverImageUrl:
          type: string
        checkInTime:
          type: string
          description: 'Horário de entrada (ex: 14:00)'
        checkOutTime:
          type: string
          description: 'Horário de saída (ex: 12:00)'
        signalPercentage:
          type: number
        tenantId:
          type: string
        createdAt:
          type: string
          format: date-time
    CreateSpacePayload:
      type: object
      required: [name, description, capacity, price]
      properties:
        name:
          type: string
        description:
          type: string
        capacity:
          type: integer
        price:
          type: number
        coverImageUrl:
          type: string
        checkInTime:
          type: string
          description: 'Horário de entrada (ex: 14:00)'
        checkOutTime:
          type: string
          description: 'Horário de saída (ex: 12:00)'
        signalPercentage:
          type: number
        tenantId:
          type: string
    UpdateSpacePayload:
      type: object
      properties:
        name:
          type: string
        description:
          type: string
        capacity:
          type: integer
        price:
          type: number
        coverImageUrl:
          type: string
        checkInTime:
          type: string
          description: 'Horário de entrada (ex: 14:00)'
        checkOutTime:
          type: string
          description: 'Horário de saída (ex: 12:00)'
        signalPercentage:
          type: number
        tenantId:
          type: string
    Reservation:
      type: object
      properties:
        id:
          type: string
        userId:
          type: string
        spaceId:
          type: string
        reservationDate:
          type: string
          format: date
        paymentId:
          type: string
        createdAt:
          type: string
          format: date-time
        updatedAt:
          type: string
          format: date-time
    CreateReservationPayload:
      type: object
      required: [userId, spaceId, reservationDate]
      properties:
        userId:
          type: string
        spaceId:
          type: string
        reservationDate:
          type: string
          format: date
        paymentId:
          type: string
    UpdateReservationPayload:
      type: object
      properties:
        userId:
          type: string
        spaceId:
          type: string
        reservationDate:
          type: string
          format: date
        paymentId:
          type: string
    PaymentStatus:
      type: string
      enum: [SIGNAL, FULL]
    Payment:
      type: object
      properties:
        id:
          type: string
        totalAmount:
          type: number
        payed:
          type: number
        status:
          $ref: '#/components/schemas/PaymentStatus'
        paidAt:
          type: string
          format: date-time
        createdAt:
          type: string
          format: date-time
    CreatePaymentPayload:
      type: object
      required: [totalAmount, payed, status, paidAt]
      properties:
        reservationIds:
          type: array
          items:
            type: string
        totalAmount:
          type: number
        payed:
          type: number
        status:
          $ref: '#/components/schemas/PaymentStatus'
        paidAt:
          type: string
          format: date-time
    UpdatePaymentPayload:
      type: object
      properties:
        totalAmount:
          type: number
        payed:
          type: number
        status:
          $ref: '#/components/schemas/PaymentStatus'
        paidAt:
          type: string
          format: date-time
    Error:
      type: object
      properties:
        message:
          type: string
        details:
          type: object

name: Generate PDF Documentation

permissions:
  contents: write

on:
  push:
    branches:
      - main
    paths:
      - 'PRIMEIRA_ENTREGA.md'
      - 'uml/**/*.mmd'
      - '.github/workflows/generate-pdf.yml'
  workflow_dispatch:

jobs:
  convert-to-pdf:
    runs-on: ubuntu-latest
    
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Detect documentation changes
        id: detect_changes
        run: |
          if git rev-parse HEAD^ >/dev/null 2>&1; then
            if git diff --quiet HEAD^ HEAD -- PRIMEIRA_ENTREGA.md 'uml/**/*.mmd'; then
              echo "pdf_needed=false" >> "$GITHUB_OUTPUT"
            else
              echo "pdf_needed=true" >> "$GITHUB_OUTPUT"
            fi
          else
            echo "pdf_needed=true" >> "$GITHUB_OUTPUT"
          fi

      - name: Install Node.js runtime
        if: steps.detect_changes.outputs.pdf_needed == 'true'
        uses: actions/setup-node@v4
        with:
          node-version: 20.11.1

      - name: Install Mermaid CLI
        if: steps.detect_changes.outputs.pdf_needed == 'true'
        run: |
          npm install -g @mermaid-js/mermaid-cli

      - name: Generate diagrams from Mermaid
        if: steps.detect_changes.outputs.pdf_needed == 'true'
        run: |
          # Create output directories
          mkdir -p uml/svg uml/png
          
          # Generate diagrams for all .mmd files in uml folder
          for file in uml/*.mmd; do
            if [ -f "$file" ]; then
              filename=$(basename "$file" .mmd)
              echo "Generating diagrams for $filename..."
              mmdc -i "$file" -o "uml/png/${filename}.png" -b transparent -p puppeteer-config.json
              mmdc -i "$file" -o "uml/svg/${filename}.svg" -p puppeteer-config.json
            fi
          done

      - name: Convert Markdown to PDF
        if: steps.detect_changes.outputs.pdf_needed == 'true'
        run: |
          docker run --rm \
            -v "$PWD":/data \
            -w /data \
            --user "$(id -u)":"$(id -g)" \
            --entrypoint sh \
            ghcr.io/pandoc/latex:latest \
            -c "pandoc PRIMEIRA_ENTREGA.md -o PRIMEIRA_ENTREGA.pdf --pdf-engine=xelatex --number-sections --syntax-highlighting=tango"

      - name: Upload generated diagrams
        if: steps.detect_changes.outputs.pdf_needed == 'true'
        uses: actions/upload-artifact@v4
        with:
          name: uml-diagrams
          path: |
            uml/png
            uml/svg
          retention-days: 30

      - name: Upload PDF as artifact
        if: steps.detect_changes.outputs.pdf_needed == 'true'
        uses: actions/upload-artifact@v4
        with:
          name: primeira-entrega-pdf
          path: PRIMEIRA_ENTREGA.pdf
          retention-days: 90

      - name: Commit PDF to repository
        if: steps.detect_changes.outputs.pdf_needed == 'true'
        run: |
          git config --local user.email "github-actions[bot]@users.noreply.github.com"
          git config --local user.name "github-actions[bot]"
          git add PRIMEIRA_ENTREGA.pdf uml/png/*.png uml/svg/*.svg
          git diff --quiet && git diff --staged --quiet || git commit -m "docs: update generated PDF and diagrams [skip ci]"

      - name: Push changes
        if: steps.detect_changes.outputs.pdf_needed == 'true'
        uses: ad-m/github-push-action@master
        with:
          github_token: ${{ secrets.GITHUB_TOKEN }}
          branch: ${{ github.ref }}
